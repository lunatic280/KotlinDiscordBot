name: discordbot

services:
  bot:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    restart: unless-stopped
    init: true
    mem_limit: 2g
    pids_limit: 256
    stop_grace_period: 45s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file:
      - ${BOT_ENV_FILE:-.env}
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=20 -XX:+ExitOnOutOfMemoryError}
      SPRING_APPLICATION_NAME: KotlinBot
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      SPRING_DATASOURCE_URL: ${DB_URL:?DB_URL must be set}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${DB_MAX_POOL_SIZE:-5}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${DB_MIN_IDLE:-1}
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT_MS:-10000}
      SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME: ${DB_KEEPALIVE_TIME_MS:-120000}
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: ${DB_MAX_LIFETIME_MS:-1800000}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DDL_AUTO:-validate}
      SPRING_JPA_SHOW_SQL: ${SHOW_SQL:-false}
      SPRING_JPA_OPEN_IN_VIEW: "false"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
